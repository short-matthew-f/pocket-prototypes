<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cog &amp; Marble">
<meta name="theme-color" content="#1d150e">
<title>Cog &amp; Marble</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
/* One look, chosen: a walnut-and-brass workshop. Standalone page (not the kit's run/tree frame); kit.js only supplies sound, sprites and particles. */
:root{--bg:#1d150e;--card:#2e2216;--line:#5c4526;--ink:#f6e7c8;--muted:#cdb98f;--accent:#ffcf6e;--go:#7bd389;--go-ink:#0f2414;
--display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;--body:"Nunito",system-ui,sans-serif;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:600 15px/1.45 var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:720px;margin:0 auto;width:100%;box-sizing:border-box}
h1{font:400 42px/1.02 var(--display);margin:10px 0 6px;color:var(--accent);text-shadow:0 3px 0 #0008}
h2{font:400 26px/1.1 var(--display);margin:0 0 6px;color:var(--accent)}
h3{font:400 20px/1.1 var(--display);margin:0;color:var(--ink)}
.muted{color:var(--muted)}
.big{font:400 22px var(--display);border:0;border-radius:16px;background:var(--go);color:var(--go-ink);padding:12px 20px;min-height:54px;box-shadow:0 5px 0 #2f6b3a;width:100%}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #2f6b3a}
.ghost{border:2px solid var(--line);background:transparent;border-radius:12px;padding:8px 14px;min-height:44px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* map */
#map{overflow-y:auto;background:radial-gradient(120% 60% at 80% 0%,#4a3518 0%,var(--bg) 60%)}
#map .wrap{padding-block:6px 40px;display:grid;gap:14px}
.crumbs{margin:10px 0 0}.crumbs a{color:var(--muted);text-decoration:none;font-size:14px}
.pack{background:#2e2216cc;border:2px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:10px}
.pack.locked{opacity:.55}
.pack header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pack header small{color:var(--muted);font-size:12.5px}
.lvls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lvl{display:grid;gap:4px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px}
.lvl:disabled{opacity:.45;cursor:default}
.lvl canvas{width:100%;aspect-ratio:8/12;border-radius:8px;background:#20170e;display:block}
.lvl b{font:400 16px var(--display)}
.medals{display:flex;gap:4px;font-size:15px}.medals span{filter:grayscale(1);opacity:.3}.medals span.on{filter:none;opacity:1}
.next{border-color:var(--accent);box-shadow:0 0 14px #ffcf6e55}
/* modal + overlays */
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:5}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;max-width:360px;width:100%;box-sizing:border-box;display:grid;gap:10px;text-align:center}
.card canvas{width:140px;height:140px;margin:0 auto}
.diffs{display:grid;gap:8px}
.diff{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;text-align:left;align-items:center;background:#20170e;border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.diff .m{grid-row:span 2;font-size:26px}.diff b{font:400 18px var(--display)}.diff small{color:var(--muted)}
/* game */
#game{background:#000}
#cv{flex:1;width:100%;touch-action:none;display:block}
#pause{position:absolute;top:calc(6px + env(safe-area-inset-top,0px));right:max(8px,env(safe-area-inset-right,0px));width:40px;height:36px;border-radius:12px;border:2px solid #ffffff30;background:#0008;color:#fff;font-size:13px;letter-spacing:-2px;padding:0}
#ui{position:absolute;left:0;right:0;bottom:0;padding:0 max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));display:grid;gap:8px}
.panel{height:126px;box-sizing:border-box;background:#1d150ee6;border:2px solid var(--line);border-radius:14px;padding:8px;display:grid;grid-template-rows:auto 1fr;gap:6px;overflow:hidden}
.msg{font:600 13px/1.3 var(--body);color:#eadbb9;margin:0}
.msg b{color:var(--accent);font-weight:800}
.prow{display:flex;gap:6px;align-self:end}
#ui button{flex:1;min-width:0;min-height:48px;border-radius:10px;border:2px solid #6e5432;background:#2c2015;color:#f6e7c8;font:800 13px/1.1 var(--body);padding:4px 6px}
#ui button small{display:block;font-weight:600;font-size:11px;color:#cdb98f}
#ui button.on{border-color:var(--accent);background:#4a3518}
#ui button:disabled{opacity:.42}
.bar{display:flex;gap:8px}
#ui .bar button{min-height:50px;font-size:15px}
#go{flex:1.6;background:#6b4b12;border-color:var(--accent);color:#fff4d6}
#go.fast{background:#2c2015;border-color:#6e5432}
</style>
</head>
<body>
<section class="scr" id="map"><div class="wrap">
  <p class="crumbs"><a href="../">← All prototypes</a></p>
  <h1>Cog &amp; Marble</h1>
  <p class="muted" style="margin:0">A marble-run tower defence. Marbles roll down the track to the vault; build towers on the empty squares to stop them. Each pack adds a new piece to the machine.</p>
  <div id="packs" style="display:grid;gap:14px"></div>
  <div class="row"><button type="button" class="ghost" id="mute">Sound: on</button><button type="button" class="ghost" id="reset">Reset progress</button></div>
</div></section>
<section class="scr" id="game" hidden><canvas id="cv"></canvas><div id="ui"></div><button type="button" id="pause" aria-label="Pause">❚❚</button></section>
<div class="modal" id="modal" hidden></div>
<script src="assets/manifest.js"></script>
<script src="../kit/kit.js"></script>
<script src="game.js"></script>
</body>
</html>
