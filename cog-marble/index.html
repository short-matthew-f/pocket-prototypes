<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cog &amp; Marble</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../kit/kit.css">
<style>
/* in-run bottom panel: fixed heights so nothing jumps when the selection changes */
.cm{display:grid;gap:8px}
.cm-panel{height:112px;box-sizing:border-box;background:#1d150ee6;border:2px solid #5c4526;border-radius:14px;padding:8px;display:grid;grid-template-rows:auto 1fr;gap:6px;overflow:hidden}
.cm-msg{font:600 13px/1.3 Nunito,system-ui,sans-serif;color:#eadbb9;margin:0}
.cm-msg b{color:#ffcf6e;font-weight:800}
.cm-row{display:flex;gap:6px;align-self:end}
.cm button{flex:1;min-width:0;min-height:44px;border-radius:10px;border:2px solid #6e5432;background:#2c2015;color:#f6e7c8;font:800 13px/1.1 Nunito,system-ui,sans-serif;padding:4px 6px}
.cm button small{display:block;font-weight:600;font-size:11px;color:#cdb98f}
.cm button.on{border-color:#ffcf6e;background:#4a3518}
.cm button:disabled{opacity:.42}
.cm-bar{display:flex;gap:8px}
.cm-bar button{min-height:52px;font-size:15px}
#cm-hold{flex:1.1;touch-action:none;-webkit-user-select:none;user-select:none;background:linear-gradient(90deg,#3d6b8a var(--steam,100%),#22303a var(--steam,100%));border-color:#7fb2d4}
#cm-hold.on{background:linear-gradient(90deg,#7fd0ff var(--steam,100%),#22303a var(--steam,100%));color:#0d1a22}
#cm-go{flex:1.4;background:#6b4b12;border-color:#ffcf6e;color:#fff4d6}
#cm-go.fast{background:#2c2015;border-color:#6e5432}
</style>
</head>
<body>
<script src="assets/manifest.js"></script>
<script src="../kit/kit.js"></script>
<script src="game.js"></script>
</body>
</html>
