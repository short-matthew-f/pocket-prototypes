<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cog &amp; Marble">
<meta name="theme-color" content="#0b0c0f">
<title>Cog &amp; Marble</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* One look, chosen: art deco. Black lacquer, gold inlay, cream type, stepped and chamfered shapes, sunbursts.
   Standalone page (not the kit's run/tree frame); kit.js only supplies sound and sprites. */
:root{--bg:#0b0c0f;--card:#15171c;--line:#8a7034;--gold:#d4af37;--gold2:#f1d58a;--ink:#f3ead3;--muted:#b9ad8f;--jade:#2f8f7a;
--display:Limelight,"Didot",Georgia,serif;--body:"Josefin Sans","Futura","Century Gothic",system-ui,sans-serif;color-scheme:dark;
--cut:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:720px;margin:0 auto;width:100%;box-sizing:border-box}
h1{font:400 44px/1 var(--display);margin:10px 0 4px;color:var(--gold2);letter-spacing:.02em;text-align:center}
h2{font:400 24px/1.1 var(--display);margin:0;color:var(--gold2);letter-spacing:.02em}
h3{font:400 18px/1.1 var(--display);margin:0;color:var(--ink)}
.rule{height:9px;margin:6px auto 10px;width:70%;background:linear-gradient(var(--gold),var(--gold)) top/100% 1px no-repeat,linear-gradient(var(--gold),var(--gold)) bottom/100% 1px no-repeat;position:relative}
.rule::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;background:var(--bg);border:1px solid var(--gold);transform:translate(-50%,-50%) rotate(45deg)}
.muted{color:var(--muted)}
.lead{color:var(--muted);margin:0;text-align:center;font-size:14.5px;text-wrap:balance}
.big{font:400 21px var(--display);letter-spacing:.04em;border:0;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#141008;padding:12px 20px;min-height:54px;width:100%;clip-path:var(--cut)}
.big:active{filter:brightness(.85)}
.ghost{border:1px solid var(--line);background:transparent;padding:8px 14px;min-height:44px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
/* map: a sunburst rising behind the title */
#map{overflow-y:auto;background:repeating-conic-gradient(from 270deg at 50% 0%,#d4af3712 0 5deg,transparent 5deg 10deg) top/100% 520px no-repeat,var(--bg)}
#map .wrap{padding-block:6px 40px;display:grid;gap:14px}
.crumbs{margin:10px 0 0}.crumbs a{color:var(--muted);text-decoration:none;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.pack{background:var(--card);border:1px solid var(--gold);outline:1px solid #d4af3755;outline-offset:-6px;padding:14px;display:grid;gap:10px;clip-path:var(--cut)}
.pack.locked{opacity:.5;border-color:var(--line)}
.pack header{display:grid;gap:2px;text-align:center}
.pack header small{color:var(--muted);font-size:12.5px;letter-spacing:.04em}
.lvls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lvl{display:grid;gap:4px;text-align:center;background:#0e1013;border:1px solid var(--line);padding:8px;clip-path:var(--cut)}
.lvl:disabled{opacity:.4;cursor:default}
.lvl canvas{width:100%;aspect-ratio:8/12;background:var(--bg);display:block}
.lvl b{font:400 15px var(--display);color:var(--ink);letter-spacing:.02em}
.medals{display:flex;gap:4px;font-size:15px;justify-content:center}.medals span{filter:grayscale(1);opacity:.3}.medals span.on{filter:none;opacity:1}
.next{border-color:var(--gold2);background:#1c1a12}
/* modal + overlays */
.modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:16px;z-index:5}
.card{background:var(--card);border:1px solid var(--gold);outline:1px solid #d4af3755;outline-offset:-6px;padding:18px 16px;max-width:360px;width:100%;box-sizing:border-box;display:grid;gap:10px;text-align:center;clip-path:var(--cut)}
.card canvas{width:140px;height:140px;margin:0 auto}
.diffs{display:grid;gap:8px}
.diff{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;text-align:left;align-items:center;background:#0e1013;border:1px solid var(--line);padding:10px 12px;clip-path:var(--cut)}
.diff .m{grid-row:span 2;font-size:26px}.diff b{font:400 18px var(--display);color:var(--gold2)}.diff small{color:var(--muted)}
/* game */
#game{background:var(--bg)}
#cv{flex:1;width:100%;touch-action:none;display:block}
#pause{position:absolute;top:calc(6px + env(safe-area-inset-top,0px));right:max(8px,env(safe-area-inset-right,0px));width:40px;height:34px;border:1px solid var(--gold);background:var(--bg);color:var(--gold2);font-size:12px;letter-spacing:-2px;padding:0}
#ui{position:absolute;left:0;right:0;bottom:0;padding:0 max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));display:grid;gap:8px}
.panel{height:126px;box-sizing:border-box;background:#0e1013f2;border:1px solid var(--gold);outline:1px solid #d4af3744;outline-offset:-5px;padding:9px;display:grid;grid-template-rows:auto 1fr;gap:6px;overflow:hidden;clip-path:var(--cut)}
.msg{font:400 13.5px/1.3 var(--body);color:var(--ink);margin:0}
.msg b{color:var(--gold2);font-weight:700}
.prow{display:flex;gap:6px;align-self:end}
#ui button{flex:1;min-width:0;min-height:48px;border:1px solid var(--line);background:#16181c;color:var(--ink);font:700 12.5px/1.1 var(--body);padding:4px 6px;clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px)}
#ui button small{display:block;font-weight:400;font-size:10.5px;color:var(--muted);margin-top:2px}
#ui button.on{border-color:var(--gold2);background:#2a2412}
#ui button:disabled{opacity:.4}
.bar{display:flex;gap:8px}
#ui .bar button{min-height:50px;font:400 17px var(--display);letter-spacing:.04em}
#go{flex:1.6;background:linear-gradient(180deg,var(--gold2),var(--gold))!important;border-color:var(--gold2)!important;color:#141008!important}
#go.fast{background:#16181c!important;color:var(--gold2)!important;border-color:var(--line)!important}
</style>
</head>
<body>
<section class="scr" id="map"><div class="wrap">
  <p class="crumbs"><a href="../">← All prototypes</a></p>
  <h1>Cog &amp; Marble</h1><div class="rule"></div>
  <p class="lead">A marble-run tower defence. Marbles roll down the track to the vault; build towers on the empty squares to stop them. Each pack adds a new piece to the machine.</p>
  <div id="packs" style="display:grid;gap:14px"></div>
  <div class="row"><button type="button" class="ghost" id="mute">Sound: on</button><button type="button" class="ghost" id="reset">Reset progress</button></div>
</div></section>
<section class="scr" id="game" hidden><canvas id="cv"></canvas><div id="ui"></div><button type="button" id="pause" aria-label="Pause">❚❚</button></section>
<div class="modal" id="modal" hidden></div>
<script src="assets/manifest.js"></script>
<script src="../kit/kit.js"></script>
<script src="game.js"></script>
</body>
</html>
