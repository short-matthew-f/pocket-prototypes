<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orrery">
<meta name="theme-color" content="#0b0e1f">
<title>Orrery</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e1f;--panel:#141a33;--panel2:#1c2446;--line:#2c3766;--ink:#e8ecff;--dim:#8f9ac8;--gold:#ffcf3f;--core:#7cf3ff;--pink:#ff5ad2;--red:#ff5b6e;--green:#6bff9e;--accent:#7fdcff;
  --display:Orbitron,system-ui,sans-serif;--body:Nunito,system-ui,sans-serif;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;font-family:var(--body);-webkit-user-select:none;user-select:none}
button{font:inherit;cursor:pointer;touch-action:manipulation;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px));background:linear-gradient(#141a33,#0f1430);border-bottom:1px solid var(--line)}
header h1{margin:0;font:900 17px var(--display);letter-spacing:.14em;flex:1;background:linear-gradient(90deg,#7fdcff,#ff5ad2);-webkit-background-clip:text;background-clip:text;color:transparent}
.cur{display:flex;align-items:center;gap:5px;font:800 15px var(--body);background:#00000050;border:1px solid var(--line);border-radius:20px;padding:4px 11px}
.cur i{font-style:normal}
.cur.coins i{color:var(--gold)}.cur.cores i{color:var(--core)}
#snd{background:none;border:0;font-size:18px;width:34px;padding:0}
main{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px max(14px,env(safe-area-inset-left,0px)) 30px;background:radial-gradient(ellipse at 50% -10%,#1a2350 0%,var(--bg) 60%)}
nav{display:flex;background:#0f1430;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--dim);font:800 12px var(--body);position:relative}
nav button b{font-size:21px;line-height:1;font-weight:400}
nav button.on{color:var(--ink)}nav button.on b{filter:drop-shadow(0 0 6px #7fdcff)}
nav button .dot{position:absolute;top:5px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--pink);box-shadow:0 0 6px var(--pink)}
body.run header,body.run nav,body.run #page{display:none}
body:not(.run) #hud{display:none}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 0;display:flex;align-items:center;gap:10px;pointer-events:none}
#hud .lv{font:900 13px var(--display);letter-spacing:.08em;color:var(--dim);min-width:52px}
#hull{flex:1;height:12px;border-radius:8px;background:#ffffff18;overflow:hidden;border:1px solid #ffffff30}
#hull i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#6bff9e,#7fdcff);transition:width .15s}
#hull.low i{background:linear-gradient(90deg,#ff5b6e,#ffa94d)}
#hud .got{font:800 15px var(--body);color:var(--gold);min-width:56px;text-align:right}
#specs{position:absolute;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column-reverse;gap:10px}
body:not(.run) #specs{display:none}
.spb{position:relative;width:62px;height:62px;border-radius:50%;border:0;padding:0;background:conic-gradient(#ffffffcc var(--k,0deg),#ffffff22 0);display:grid;place-items:center;touch-action:none}
.spb::before{content:'';position:absolute;inset:4px;border-radius:50%;background:#0b0e1fe0}
.spb img{position:relative;width:46px;height:46px;opacity:.45}
.spb.ready{box-shadow:0 0 16px #ffffffaa}.spb.ready img{opacity:1}
#pause{pointer-events:auto;width:42px;height:42px;border-radius:50%;border:1px solid #ffffff40;background:#00000060;font-size:16px}
h2{font:900 18px var(--display);letter-spacing:.08em;margin:6px 0 4px}
h3{font:800 13px var(--display);letter-spacing:.1em;color:var(--dim);margin:18px 0 8px;text-transform:uppercase}
p.sub{color:var(--dim);margin:0 0 10px;font-size:14px;line-height:1.35}
.btn{border:0;border-radius:14px;padding:11px 16px;font:800 15px var(--body);background:var(--panel2);border:1px solid var(--line)}
.btn.go{background:linear-gradient(#8ae6ff,#4aa8e8);color:#061028;border:0;font:900 16px var(--display);letter-spacing:.06em;box-shadow:0 0 18px #7fdcff55}
.btn.pink{background:linear-gradient(#ff8de3,#d63aa8);color:#1a0618;border:0}
.btn:disabled{opacity:.4}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:11px}
.big{display:block;width:100%;min-height:58px;font-size:18px;margin:6px 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.lvl{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:900 18px var(--display);padding:0}
.lvl small{font:800 11px var(--body);color:var(--gold);letter-spacing:1px}
.lvl.boss{border-color:#ff4d6d;background:linear-gradient(#2a1430,#141a33)}
.lvl.cur{box-shadow:0 0 0 2px var(--accent),0 0 14px #7fdcff66}
.lvl:disabled{opacity:.3}
.cards{display:flex;flex-direction:column;gap:8px}
.card{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 10px}
.card img{width:46px;height:46px;flex:none}
.card .tx{flex:1;min-width:0}
.card b{display:block;font-size:15px}
.card span{display:block;color:var(--dim);font-size:12.5px;line-height:1.3}
.card .btn{flex:none;min-width:84px}
.card.done{opacity:.55}
.pv{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(circle at 50% 50%,#18204a,#0b0e1f 75%)}
#pv{display:block;width:100%;height:min(46vh,360px);touch-action:none}
.pvb{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.pvb .btn{background:#000000a0}
.pvhint{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--dim);pointer-events:none}
.sel{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.sel .hd{display:flex;align-items:center;gap:10px}
.sel .hd img{width:40px;height:40px}
.sel .hd b{font-size:16px;flex:1}
.sel p{margin:6px 0;color:var(--dim);font-size:13px;line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border-radius:20px;border:1px solid var(--line);background:#0b0e1f;padding:6px 12px;font:800 13px var(--body)}
.chip.on{background:var(--accent);color:#061028;border-color:var(--accent)}
.chip:disabled{opacity:.35}
.lab{font:800 11px var(--body);color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-top:8px}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-top:6px}
.part{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 4px;border-radius:12px;border:1px solid var(--line);background:#0b0e1f;font:800 12px var(--body)}
.part img{width:38px;height:38px}
.part small{color:var(--dim);font-weight:600}
.part:disabled{opacity:.35}
.tree{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px}
.tr{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;border-radius:10px;padding:5px 6px;text-align:left;font:700 14px var(--body)}
.tr img{width:26px;height:26px}
.tr small{color:var(--dim);font-weight:600;margin-left:auto}
.tr.on{background:#7fdcff22;outline:1px solid #7fdcff88}
.tr.empty{color:var(--dim)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#modal{position:fixed;inset:0;background:#03050ccc;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20;backdrop-filter:blur(3px)}
#modal .box{width:min(380px,100%);max-height:90vh;overflow:auto;background:linear-gradient(#1a2148,#111634);border:1px solid var(--line);border-radius:20px;padding:18px 18px 14px;text-align:center;box-shadow:0 10px 50px #000}
#modal h2{font-size:22px;margin:2px 0 6px}
#modal .stars{font-size:34px;letter-spacing:6px;color:var(--gold);text-shadow:0 0 12px #ffcf3f88;margin:2px 0 6px}
#modal .stars i{font-style:normal;color:#ffffff22;text-shadow:none}
#modal .ln{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px solid #ffffff12;font-size:15px}
#modal .ln b{color:var(--gold)}#modal .ln b.c{color:var(--core)}
#modal .btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
#modal p{color:var(--dim);line-height:1.45;text-align:left;font-size:14.5px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000000d0;border:1px solid var(--line);padding:8px 14px;border-radius:12px;font-weight:800;font-size:14px;z-index:30;pointer-events:none;transition:opacity .3s;opacity:0;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.statline{color:var(--dim);font-size:13px;margin-top:14px;text-align:center}
</style>
</head>
<body>
<div id="app">
  <header><h1>ORRERY</h1><span class="cur coins"><i>●</i><span id="coins">0</span></span><span class="cur cores"><i>◆</i><span id="cores">0</span></span><button id="snd" aria-label="Sound">🔊</button></header>
  <main>
    <canvas id="cv"></canvas>
    <div id="hud"><span class="lv" id="hlv">L1</span><div id="hull"><i></i></div><span class="got" id="hgot">● 0</span><button id="pause" aria-label="Pause">❚❚</button></div>
    <div id="specs"></div>
    <div id="page"></div>
  </main>
  <nav id="tabs">
    <button data-tab="levels"><b>☄</b>Levels</button>
    <button data-tab="hangar"><b>✺</b>Hangar</button>
    <button data-tab="shop"><b>●</b>Shop</button>
    <button data-tab="lab"><b>◆</b>Lab</button>
  </nav>
</div>
<div id="modal" hidden><div class="box"></div></div>
<div id="toast"></div>
<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
