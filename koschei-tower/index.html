<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Koschei">
<meta name="theme-color" content="#140c10">
<title>Koschei's Tower</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#140c10;--panel:#22141c;--panel2:#2e1a26;--line:#4a2c38;--ink:#f4ecd8;--dim:#b49c9c;--gold:#f0b43c;--gold2:#ffe08a;--red:#d8343c;--red2:#8c1c2c;--ice:#8cd8f0;--green:#6cb44c;--violet:#c48cff;
  --display:'Press Start 2P',monospace;--body:'Pixelify Sans',system-ui,sans-serif;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;font-family:var(--body);-webkit-user-select:none;user-select:none;font-variant-ligatures:none}
button{font:inherit;cursor:pointer;touch-action:manipulation;color:inherit}
img,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px));background:#1c1016;border-bottom:2px solid var(--red2)}
header h1{margin:0;font:400 12px var(--display);letter-spacing:.08em;flex:1;color:var(--gold);text-shadow:2px 2px 0 var(--red2);white-space:nowrap;overflow:hidden}
.cur{display:flex;align-items:center;gap:5px;font:700 15px var(--body);background:#00000060;border:2px solid var(--line);padding:3px 9px}
.cur i{font-style:normal;font-size:12px}
.cur.k i{color:#e0904c}.cur.f i{color:#ff8a3c}
#snd{background:none;border:2px solid var(--line);font:400 9px var(--display);padding:6px 7px;color:var(--dim)}
main{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px max(14px,env(safe-area-inset-left,0px)) 30px;background:var(--bg)}
#page.tree{padding:0;overflow:hidden}
nav{display:flex;background:#1c1016;border-top:2px solid var(--red2);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--dim);font:400 8px var(--display);letter-spacing:.06em;position:relative}
nav button b{font:400 15px var(--display);line-height:1}
nav button.on{color:var(--gold)}
nav button .dot{position:absolute;top:5px;right:calc(50% - 20px);width:8px;height:8px;background:var(--red);box-shadow:0 0 0 2px #1c1016}
body.run header,body.run nav,body.run #page{display:none}
#pause{position:absolute;right:max(8px,env(safe-area-inset-right,0px));top:calc(6px + env(safe-area-inset-top,0px));width:38px;height:34px;border:2px solid #ffffff40;background:#00000080;font:400 9px var(--display);z-index:5}
body:not(.run) #pause{display:none}
.wrap{max-width:520px;margin:0 auto}
h2{font:400 13px var(--display);letter-spacing:.06em;margin:8px 0 6px;color:var(--gold);text-shadow:2px 2px 0 var(--red2);line-height:1.5}
h3{font:400 9px var(--display);letter-spacing:.08em;color:var(--dim);margin:20px 0 8px;text-transform:uppercase}
p.sub{color:var(--dim);margin:0 0 10px;font-size:15px;line-height:1.35}
.btn{border:2px solid var(--line);padding:11px 16px;font:700 16px var(--body);background:var(--panel2);box-shadow:3px 3px 0 #000}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn.go{background:var(--red);border-color:var(--gold);color:var(--gold2);font:400 13px var(--display);letter-spacing:.06em;text-shadow:2px 2px 0 var(--red2)}
.btn.gold{background:var(--gold);color:#2a1a24;border-color:var(--gold2)}
.btn:disabled{opacity:.4}
.btn.sm{padding:7px 11px;font-size:14px}
.big{display:block;width:100%;min-height:60px;margin:10px 0 4px}
.card{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--line);padding:10px;box-shadow:3px 3px 0 #000}
.card canvas{flex:none;background:#0c0609;border:2px solid var(--line)}
.card .tx{flex:1;min-width:0}
.card b{display:block;font:400 11px var(--display);line-height:1.5;color:var(--gold)}
.card span{display:block;color:var(--dim);font-size:14px;line-height:1.3}
.bar{height:10px;background:#00000080;border:2px solid var(--line);margin-top:6px}
.bar i{display:block;height:100%;background:var(--gold)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-top:10px;font-size:15px}
.stats div{display:flex;justify-content:space-between;border-bottom:1px solid #ffffff12;padding:2px 0}
.stats b{color:var(--gold2);font-weight:700}
.floors{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px}
.fl{aspect-ratio:1;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;font:400 8px var(--display);color:var(--dim)}
.fl.done{background:#3a1c26;color:var(--ink)}
.fl.boss{border-color:var(--red)}
.fl.boss.done{background:var(--red2);color:var(--gold2)}
.fl.k{border-color:#4cd87c}
.cps{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:var(--panel);padding:8px 11px;font:400 9px var(--display);box-shadow:2px 2px 0 #000}
.chip.on{background:var(--gold);color:#2a1a24;border-color:var(--gold2)}
.chip:disabled{opacity:.35}
.relics{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.relic{background:var(--panel);border:2px solid var(--line);padding:8px 10px;font-size:13.5px;color:var(--dim);line-height:1.3}
.relic b{display:block;color:var(--gold);font-size:15px}
.relic.no{opacity:.45}
.heroes{display:flex;flex-direction:column;gap:8px}
.card.sel{border-color:var(--gold);box-shadow:3px 3px 0 #000,0 0 0 2px var(--red2) inset}
.card.locked{opacity:.45}
/* tree */
#tv{position:absolute;inset:0;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 40%,#2a1420,#140c10 70%)}
#tl{position:absolute;left:0;top:0;transform-origin:0 0}
#tl svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.nd{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border:3px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;box-shadow:3px 3px 0 #000}
.nd .ic{font-size:22px;line-height:1;filter:saturate(.8)}
.nd small{font:400 7px var(--display);color:var(--dim);margin-top:4px}
.nd.can{border-color:var(--gold);animation:pulse 1.2s steps(2) infinite}
.nd.max{border-color:#6cb44c;background:#1c2c1c}
.nd.max small{color:#8cd46c}
.nd.lock{opacity:.28;filter:grayscale(1)}
.nd.f{border-style:dashed}
.nd.win{width:68px;height:68px;margin:-34px 0 0 -34px;border-color:var(--red)}
.nd.on{outline:3px solid var(--gold2);outline-offset:2px}
@keyframes pulse{50%{border-color:var(--gold2)}}
#tinfo{position:absolute;left:0;right:0;bottom:0;background:#1c1016f0;border-top:2px solid var(--red2);padding:10px 14px 12px;display:flex;gap:10px;align-items:center}
#tinfo .tx{flex:1;min-width:0}
#tinfo b{font:400 10px var(--display);color:var(--gold);line-height:1.5}
#tinfo p{margin:3px 0 0;color:var(--dim);font-size:14px;line-height:1.3}
#tinfo .btn{min-width:96px}
#thelp{position:absolute;left:10px;top:8px;font:400 7px var(--display);color:var(--dim);pointer-events:none;line-height:1.6}
/* modal */
#modal{position:fixed;inset:0;background:#0a0408d0;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
#modal .box{width:min(390px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:3px solid var(--gold);padding:16px 16px 14px;text-align:center;box-shadow:6px 6px 0 #000,0 0 0 3px var(--red2) inset}
#modal h2{font-size:15px;margin:2px 0 8px}
#modal .ln{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px solid #ffffff14;font-size:16px}
#modal .ln b{color:var(--gold2)}
#modal .btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
#modal p{color:var(--dim);line-height:1.45;text-align:left;font-size:15px;margin:6px 0}
#modal p b{color:var(--ink)}
#modal .note{color:var(--gold2);font-size:15px;margin:10px 0 0;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000000e0;border:2px solid var(--gold);padding:8px 14px;font-weight:700;font-size:15px;z-index:30;pointer-events:none;transition:opacity .3s;opacity:0;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.foot{color:var(--dim);font-size:13px;margin-top:18px;text-align:center}
.keys{font-size:14px;color:var(--dim);line-height:1.5}
.keys kbd{font:400 8px var(--display);background:#000;border:1px solid var(--line);padding:2px 4px;color:var(--ink)}
</style>
</head>
<body>
<div id="app">
  <header><h1>KOSCHEI'S TOWER</h1><span class="cur k"><i>●</i><span id="kop">0</span></span><span class="cur f" id="fwrap"><i>✦</i><span id="fea">0</span></span><button id="snd" aria-label="Sound">♪</button></header>
  <main>
    <canvas id="cv"></canvas>
    <button id="pause" aria-label="Pause">II</button>
    <div id="page"></div>
  </main>
  <nav id="tabs">
    <button data-tab="tower"><b>♜</b>TOWER</button>
    <button data-tab="tree"><b>✶</b>SKILLS</button>
    <button data-tab="hero"><b>☺</b>HERO</button>
  </nav>
</div>
<div id="modal" hidden><div class="box"></div></div>
<div id="toast"></div>
<script src="assets/manifest.js" onerror="window.PP_ASSETS={img:{},sfx:{}}"></script>
<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
