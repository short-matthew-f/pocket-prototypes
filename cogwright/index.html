<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cogwright">
<meta name="theme-color" content="#1d1712">
<title>Cogwright</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d1712;--wood:#2b211a;--wood2:#3a2c21;--brass:#d4a94e;--brass2:#a37b2c;--copper:#c0703e;--steel:#8c8f99;--paper:#f3e6c6;--ink:#241a12;--dim:#a8957a;--red:#e0553a;--green:#5fcf7a;
  --display:Cinzel,Georgia,serif;--body:Nunito,system-ui,sans-serif;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--paper);overflow:hidden;overscroll-behavior:none;font-family:var(--body);-webkit-user-select:none;user-select:none}
button{font:inherit;cursor:pointer;touch-action:manipulation;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px));background:linear-gradient(#2e231a,#241b14);border-bottom:2px solid #4a3826}
header h1{margin:0;font:900 17px var(--display);color:var(--brass);letter-spacing:.06em;flex:1}
.cur{display:flex;align-items:center;gap:4px;font:800 14px var(--body);background:#00000040;border:1px solid #5a4430;border-radius:20px;padding:3px 9px}
.cur i{font-style:normal}
main{flex:1;position:relative;min-height:0}
#gl,#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#gl{pointer-events:none}
body.codex #gl,body.tree #gl{display:none}
#foot{display:flex;gap:8px;align-items:center;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:#241b14;border-top:2px solid #4a3826}
.depth{display:flex;align-items:center;background:#00000040;border:2px solid #5a4430;border-radius:14px;overflow:hidden}
.depth button{background:none;border:0;width:38px;height:46px;font-size:18px;color:var(--brass)}
.depth button:disabled{opacity:.3}
.depth span{min-width:86px;text-align:center;font:700 13px/1.1 var(--body)}
.depth b{display:block;font:900 17px var(--display);color:var(--paper)}
#go{flex:1;min-width:0;white-space:nowrap;min-height:52px;border:3px solid #3a2810;border-radius:16px;background:linear-gradient(#f0c86a,#c99a3a);color:var(--ink);font:900 17px var(--display);letter-spacing:.04em;box-shadow:0 4px 0 #3a2810}
#daily{flex:none;width:58px;min-height:52px;border:2px solid #5a4430;border-radius:14px;background:#00000040;color:var(--brass);display:grid;place-items:center;padding:2px 0;font:800 10px var(--body)}
#daily b{font-size:20px;line-height:1}#daily.done{opacity:.45}#daily.new{border-color:var(--brass);box-shadow:0 0 12px #d4a94e80}
#go:active{transform:translateY(3px);box-shadow:0 1px 0 #3a2810}
nav{display:flex;background:#1a130e;border-top:1px solid #4a3826;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:8px 0 7px;color:var(--dim);font:800 11px var(--body);display:grid;justify-items:center;gap:1px}
nav button b{font-size:20px;line-height:1.1}
nav button.on{color:var(--brass)}
nav button .dot{width:7px;height:7px;border-radius:50%;background:var(--red);position:absolute;margin:0 0 0 22px}
body.shift header,body.shift #foot,body.shift nav{display:none}
body.shift #cv,body.shift #gl{top:env(safe-area-inset-top,0px);height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);color:var(--ink);border-top:4px solid var(--brass2);border-radius:18px 18px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -8px 30px #000a;max-height:72vh;overflow:auto;transform:translateY(0);transition:transform .18s}
#sheet[hidden]{display:block!important;visibility:visible;transform:translateY(110%);pointer-events:none}
#sheet h3{margin:0 34px 2px 0;font:900 19px var(--display)}
#sheet .sub{font:700 12px var(--body);color:#6b5a44;margin-bottom:8px}
#sheet ul{margin:6px 0;padding:0;list-style:none;display:grid;gap:3px}
#sheet li{font:700 14px/1.3 var(--body)}
#sheet li.aff{color:#2d5fb3}#sheet li.aff.dim{opacity:.45;text-decoration:line-through}
#sheet li.aff button{border:1px solid #2d5fb3;background:#fff;border-radius:8px;font:800 11px var(--body);padding:1px 6px;margin-left:6px;color:#2d5fb3}
#sheet .power{color:#b85a00;font:800 14px/1.35 var(--body);margin:6px 0}
#sheet .set{color:#1d8a45;font:700 13px/1.35 var(--body)}
#sheet .set .on{font-weight:900}
#sheet .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#sheet .acts button{flex:1 1 30%;min-height:42px;border:2px solid var(--ink);border-radius:12px;background:#fff;font:800 13px var(--body);color:var(--ink)}
#sheet .acts button.pri{background:var(--brass);}
#sheet .acts button:disabled{opacity:.4}
#sheet ul button:disabled{opacity:.35}
#sheet .x{position:absolute;right:12px;top:10px;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:#fff;font:900 16px var(--body);color:var(--ink)}
#sheet .warn{color:#b3261e;font:800 13px var(--body)}
#modal{position:fixed;inset:0;z-index:8;background:#0b0806c0;display:grid;place-items:center;padding:16px}
#modal[hidden]{display:none}
.card{width:min(400px,100%);background:var(--paper);color:var(--ink);border:4px solid var(--brass2);border-radius:20px;padding:18px;display:grid;gap:10px;text-align:center;box-shadow:0 10px 40px #000}
.card h2{margin:0;font:900 26px var(--display);color:#7a4a12}
.card p{margin:0;font:700 14px/1.4 var(--body)}
.card .loot{display:grid;gap:4px;text-align:left;max-height:30vh;overflow:auto}
.card .loot div{font:800 14px var(--body);padding:4px 8px;border-radius:8px;background:#fff8}
.card .row{display:flex;gap:8px}
.card .row button,.card>button{flex:1;min-height:48px;border:3px solid var(--ink);border-radius:14px;background:var(--brass);font:900 16px var(--display);color:var(--ink)}
.card .row button.alt{background:#fff}
#page{position:absolute;inset:0;overflow:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:none}
body.codex #page{display:block}
body.codex #cv{display:none}
#page h2{font:900 18px var(--display);color:var(--brass);margin:16px 0 6px;text-wrap:balance}
#page h2:first-child{margin-top:0}
#page p,#page li{font:600 14px/1.45 var(--body);color:var(--paper)}
#page table{width:100%;border-collapse:collapse;font:700 13px var(--body)}
#page td{padding:5px 4px;border-bottom:1px solid #4a3826}
#page td:last-child{text-align:right}
#page .leg{color:#ff8a1f}#page .unk{color:var(--dim)}
#page button{min-height:42px;border:2px solid #5a4430;border-radius:12px;background:#00000040;padding:0 14px;font:800 14px var(--body);color:var(--paper);margin:4px 6px 4px 0}
#page button.danger{border-color:var(--red);color:var(--red)}
#toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9;background:#000c;color:var(--paper);font:800 14px var(--body);padding:8px 14px;border-radius:12px;pointer-events:none;opacity:0;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header><h1>Cogwright</h1>
    <span class="cur" title="Scrap"><i>⛭</i><span id="c-scrap">0</span></span>
    <span class="cur" title="Brass"><i>🔩</i><span id="c-brass">0</span></span>
    <span class="cur" id="c-bp-wrap" title="Blueprints" hidden><i>📜</i><span id="c-bp">0</span></span>
  </header>
  <main><canvas id="gl"></canvas><canvas id="cv"></canvas><div id="page"></div></main>
  <div id="foot">
    <div class="depth"><button id="d-prev" aria-label="Shallower">◀</button><span><b id="d-num">1</b><span id="d-zone">Foundry</span></span><button id="d-next" aria-label="Deeper">▶</button></div>
    <button id="daily" aria-label="Daily Contract"><b>📜</b><small>Daily</small></button>
    <button id="go">Start Shift</button>
  </div>
  <nav>
    <button data-tab="bench" class="on"><b>⚙</b>Bench</button>
    <button data-tab="tree"><b>✦</b>Upgrades<i class="dot" id="tree-dot" hidden></i></button>
    <button data-tab="codex"><b>📖</b>Codex</button>
  </nav>
</div>
<div id="sheet" hidden></div>
<div id="modal" hidden></div>
<div id="toast"></div>
<script src="assets/manifest.js"></script>
<script src="data.js"></script>
<script src="model.js"></script>
<script src="app.js"></script>
<script type="module" src="gl.js"></script>
</body>
</html>
