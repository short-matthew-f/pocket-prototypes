<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Encounter">
<meta name="theme-color" content="#0f1a14">
<title>Random Encounter</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1a14;--panel:#1a2a20;--panel2:#22382a;--line:#3c5c44;--ink:#f4ecd8;--dim:#a8b89c;--gold:#f0c850;--red:#d8343c;
  --display:'Press Start 2P',monospace;--body:'Pixelify Sans',system-ui,sans-serif;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;font-family:var(--body);-webkit-user-select:none;user-select:none;font-variant-ligatures:none}
button{font:inherit;cursor:pointer;touch-action:manipulation;color:inherit}
img,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#page{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) calc(30px + env(safe-area-inset-bottom,0px));background:radial-gradient(ellipse at 50% 0%,#24402c,var(--bg) 70%)}
body.run #page{display:none}
#pause{position:fixed;right:max(8px,env(safe-area-inset-right,0px));top:calc(26px + env(safe-area-inset-top,0px));width:36px;height:32px;border:2px solid #ffffff40;background:#00000080;font:400 9px var(--display);z-index:5}
body:not(.run) #pause{display:none}
.wrap{max-width:520px;margin:0 auto}
h1{font:400 22px/1.5 var(--display);color:var(--gold);text-shadow:3px 3px 0 #5c3c14;margin:6px 0 10px;letter-spacing:.04em}
h2{font:400 13px/1.5 var(--display);color:var(--gold);text-shadow:2px 2px 0 #5c3c14;margin:4px 0 6px}
h3{font:400 9px var(--display);letter-spacing:.08em;color:var(--dim);margin:20px 0 10px;text-transform:uppercase}
p.sub{color:var(--dim);margin:0 0 10px;font-size:16px;line-height:1.4}
.jobs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.job{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--panel);border:2px solid var(--line);padding:10px;box-shadow:3px 3px 0 #000}
.job:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.job.sel{border-color:var(--gold)}
.job .ic{height:48px;display:flex;align-items:flex-end}
.job b{font:400 10px var(--display);color:var(--gold);margin-top:4px}
.job span{font-size:14px;color:var(--dim);line-height:1.25}
.job small{font:400 7px var(--display);color:var(--ink);margin-top:4px;line-height:1.5}
.btn{border:2px solid var(--line);padding:11px 16px;font:700 16px var(--body);background:var(--panel2);box-shadow:3px 3px 0 #000}
.btn.go{background:#3c7c3c;border-color:var(--gold);color:#fff8dc;font:400 11px var(--display)}
.btn.sm{padding:7px 11px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.foot{color:var(--dim);font-size:14px;margin-top:16px;line-height:1.4}
#modal{position:fixed;inset:0;background:#05100acc;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
#modal .box{width:min(400px,100%);max-height:92vh;overflow:auto;background:linear-gradient(#2a1e14,#1c140e);border:3px solid var(--gold);padding:14px;text-align:center;box-shadow:6px 6px 0 #000,inset 0 0 0 3px #5c3c14}
#modal .box.cards{text-align:left}
#modal .box.cards h2,#modal .box.cards p.sub{text-align:center}
.card{display:flex;align-items:center;gap:12px;width:100%;margin:8px 0;background:#3a2a1a;border:2px solid #7c5c2c;padding:10px;text-align:left;box-shadow:3px 3px 0 #000}
.card:active{transform:translate(2px,2px)}
.card .ic{flex:none;width:52px;height:52px;display:grid;place-items:center;font-size:30px;background:#1c140e;border:2px solid #5c3c14}
.card .tx{flex:1;min-width:0}
.card small{display:block;font:400 7px var(--display);color:var(--dim);letter-spacing:.06em}
.card b{display:block;font:400 11px/1.6 var(--display);color:var(--gold)}
.card span span,.card .tx>span{display:block;font-size:15px;line-height:1.3;color:var(--ink)}
.card kbd{font:400 8px var(--display);color:var(--dim)}
#modal .ln{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px solid #ffffff14;font-size:16px}
#modal .ln b{color:var(--gold)}
#modal .btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.party{display:flex;justify-content:center;gap:10px;margin:6px 0 8px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="pause" aria-label="Pause">II</button>
<div id="page"></div>
<div id="modal" hidden><div class="box"></div></div>
<script src="assets/manifest.js" onerror="window.PP_ASSETS={img:{},sfx:{}}"></script>
<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
